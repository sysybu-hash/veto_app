  <path d="M75 49H188" stroke="url(#vetoGold)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="205" cy="37" r="3" fill="#C5A059"/>
  <path d="M215 37H241" stroke="url(#vetoGold)" stroke-width="1.8" stroke-linecap="round"/>
