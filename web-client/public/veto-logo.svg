<svg width="256" height="72" viewBox="0 0 256 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>VETO Legal Logo</title>
  <desc>Premium VETO Legal wordmark with a monogram seal and gold underline.</desc>
  <defs>
    <linearGradient id="vetoGold" x1="28" y1="11" x2="216" y2="67" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6D98A"/>
      <stop offset="0.42" stop-color="#C5A059"/>
      <stop offset="1" stop-color="#8B6A2F"/>
    </linearGradient>
    <linearGradient id="vetoInk" x1="73" y1="16" x2="199" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6D9"/>
      <stop offset="1" stop-color="#C5A059"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-35%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#C5A059" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#softGlow)">
    <rect x="7" y="8" width="56" height="56" rx="17" fill="#070D1D" stroke="url(#vetoGold)" stroke-width="1.7"/>
    <path d="M22 23.5L35 49L48 23.5" stroke="url(#vetoGold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28.5 23.5H50" stroke="#FFF0C2" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <text
    x="75"
    y="43"
    fill="url(#vetoInk)"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="34"
    font-weight="900"
    letter-spacing="4"
  >VETO</text>
  <text
    x="78"
    y="58"
    fill="#B9C3D6"
