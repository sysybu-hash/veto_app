<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>VETO Legal - Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f8fafc, #ffffff);
        color: #0f172a;
      }
      main {
        width: min(92vw, 520px);
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
        padding: 32px;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        margin: 0;
        line-height: 1.7;
        color: #475569;
      }
      a {
        display: inline-flex;
        margin-top: 24px;
        border-radius: 16px;
        background: #0f172a;
        color: #ffffff;
        padding: 12px 18px;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>VETO</h1>
      <p>אין כרגע חיבור לרשת. אפשר לחזור למסך הבית כשיש חיבור יציב.</p>
      <a href="/hub">חזרה לבית</a>
    </main>
  </body>
</html>
