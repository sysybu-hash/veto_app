# ============================================================
#  render.yaml — VETO App · Render Blueprint
#  Backend: Node.js + Express + Socket.io + MongoDB
#
#  Deploy בפעם הראשונה:
#    Render Dashboard → New → Blueprint → בחר repo
#    Render יקרא קובץ זה ויצור את השירות אוטומטית
#
#  Deploy ידני (Service קיים):
#    Settings → Root Directory: backend
#    Build Command:  npm ci --legacy-peer-deps
#    Start Command:  npm start
#    Health Check:   /health
#
#  Public URL ב-Render יכול להיות שונה משם השירות (למשל שירות veto_legal → veto-app-new.onrender.com).
#  בדוק ב-Dashboard → URL אמיתי, ולעדכן VETO_API_BASE / AppConfig בהתאם.
#  בדיקת בריאות:  GET https://<your-service>.onrender.com/health
#  משתני סביבה (מסלול בלי Firebase): backend/ENV_GUIDE.md
# ============================================================

services:
  - type: web
    name: veto_legal
    runtime: node
    region: frankfurt
    plan: free
    # Explicit production branch — every push to main deploys the API.
    branch: main
    autoDeployTrigger: commit
    rootDir: backend
    buildCommand: npm ci --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /health

    envVars:

      # ── Server ──────────────────────────────────────────────
      - key: NODE_ENV
        value: production

      # ── Database ─────────────────────────────────────────────
      # חובה: mongodb+srv://user:pass@cluster/dbname?retryWrites=true&w=majority
      - key: MONGO_URI
        sync: false

      # ── Auth ──────────────────────────────────────────────────
      # חובה: מחרוזת אקראית ארוכה (openssl rand -hex 64)
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d

      # ── Google OAuth ──────────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        value: 752712664923-7loca49f7fggd514q8reljn93meatmrf.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # ── AI — Gemini (צ'אט + תמלול) ────────────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      # ── Agora RTC — sync מ-Dashboard: אותו App ID כמו ב-Flutter + Certificate מ-Console
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false

      # ── Cloudinary (הקלטות + ראיות) ───────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Optional: calendar email (ICS) + FCM (replace placeholder google-services) ─
      # - key: PUBLIC_API_BASE
      #   value: https://veto-app-new.onrender.com
      # - key: SMTP_HOST, SMTP_PORT, SMTP_FROM, SMTP_USER, SMTP_PASS
      # - key: FIREBASE_SERVICE_ACCOUNT
      #   sync: false

      # ── Web Push (VAPID) ──────────────────────────────────────
      # Both keys set in Dashboard so we can rotate the keypair
      # without committing the public key to the repo.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@veto-legal.com

      # ── Monitoring (Sentry) — אופציונלי ──────────────────────
      - key: SENTRY_DSN
        sync: false

      # ── OTP בלי SMS (Render / בדיקות) ─────────────────────────
      # RETURN_OTP_IN_JSON=1 מחזיר OTP ב-JSON כשאין Twilio — השרת יעלה; יודפס אזהרה בלבד.
      # אם Twilio מוגדר וגם RETURN_OTP_IN_JSON=1 — חובה ALLOW_OTP_IN_JSON_PRODUCTION=1 או להסיר את RETURN_OTP_IN_JSON.
      # - key: RETURN_OTP_IN_JSON
      #   value: "1"
      # - key: ALLOW_OTP_IN_JSON_PRODUCTION
      #   value: "1"

  # ────────────────────────────────────────────────────────────
  # Health Ping — Render Free dynos sleep after 15 min of inactivity.
  # This cron hits /health every 14 min so Socket.io / SOS dispatch
  # never lose state to a cold start. Free plan, ~1 s per run.
  # Uses the same Node image as the backend — no Docker image to maintain.
  # ────────────────────────────────────────────────────────────
  - type: cron
    name: veto-health-ping
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    schedule: "*/14 * * * *"
    rootDir: backend
    buildCommand: echo "no build needed"
    startCommand: node scripts/health-ping.js
    envVars:
      - key: HEALTH_URL
        value: https://veto-app-new.onrender.com/health
