# CI: backend + Flutter checks; production web = Next.js via Vercel (web-client).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  # Render API origin — must match NEXT_PUBLIC_API_ORIGIN on Vercel (web-client).
  VETO_API_BASE: https://veto-app-new.onrender.com

jobs:
  no-env-in-git:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: node .github/scripts/verify-no-secrets-in-git.js

  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check server.js
      - run: npm run lint
      - run: npm test

  flutter-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Root Directory in Vercel project must stay `web-client`. Run `vercel deploy` from repo
  # root — if cwd is already `web-client`, Vercel appends the setting → web-client/web-client.
  deploy-vercel:
    runs-on: ubuntu-latest
    needs: [no-env-in-git, backend-ci]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: vercel-deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install and build Next.js
        working-directory: web-client
        env:
          NEXT_PUBLIC_API_ORIGIN: ${{ env.VETO_API_BASE }}
        run: |
          set -e
          npm ci
          npm run build

      - name: Vercel CLI (auth check)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          npx --yes vercel@latest --version
          npx --yes vercel@latest whoami

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          npx --yes vercel@latest deploy --prod --yes
