# CI: secrets check, backend, deploy Next.js (web-client) to Vercel.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  # Render API origin — must match NEXT_PUBLIC_API_ORIGIN on Vercel (web-client).
  VETO_API_BASE: https://veto-app-new.onrender.com

jobs:
  no-env-in-git:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: node .github/scripts/verify-no-secrets-in-git.js

  # Secret scanning across full git history, not just the current diff — catches a key
  # committed and later removed, which verify-no-secrets-in-git.js (working-tree only) misses.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check server.js
      - run: npm run lint
      - run: npm test
      # Non-blocking for now: the repo has pre-existing high/critical transitive
      # vulnerabilities (e.g. websocket-driver via socket.io) that need a deliberate,
      # tested upgrade rather than a build-breaking gate. Flip to a hard failure once
      # the current findings are triaged/fixed.
      - name: npm audit (report only)
        continue-on-error: true
        run: npm audit --audit-level=high

  web-client-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - run: npm ci
      - name: npm audit (report only)
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_ORIGIN: ${{ env.VETO_API_BASE }}
          NEXT_PUBLIC_CALL_V2: '1'
      # Real E2E findings can be flaky against third-party services (Agora/Ably) in CI;
      # keep this non-blocking until the suite is proven stable, but always run + report.
      - name: Playwright E2E (report only)
        continue-on-error: true
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web-client/playwright-report/
          retention-days: 14

  # Root Directory in Vercel project must stay `web-client`. Run `vercel deploy` from repo
  # root — if cwd is already `web-client`, Vercel appends the setting → web-client/web-client.
  deploy-vercel:
    runs-on: ubuntu-latest
    needs: [no-env-in-git, secret-scan, backend-ci]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: vercel-deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install and build Next.js
        working-directory: web-client
        env:
          NEXT_PUBLIC_API_ORIGIN: ${{ env.VETO_API_BASE }}
        run: |
          set -e
          npm ci
          npm run build

      - name: Verify PWA service worker was actually generated
        working-directory: web-client
        # Regression guard: next-pwa only hooks into webpack, not Turbopack (Next 16's
        # default for `next build`). If `build` script ever loses `--webpack`, this
        # silently stops producing /sw.js — which also kills SOS push notifications to
        # lawyers (worker/index.ts) with zero errors anywhere in the build log.
        run: |
          set -e
          test -f public/sw.js || { echo "::error::public/sw.js was not generated — PWA/push notifications will be broken in production. Check next.config.mjs / package.json build script uses 'next build --webpack'."; exit 1; }

      - name: Vercel CLI (auth check)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          npx --yes vercel@latest --version
          npx --yes vercel@latest whoami

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          npx --yes vercel@latest deploy --prod --yes
