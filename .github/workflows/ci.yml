# CI: secrets check, backend, deploy Next.js (web-client) to Vercel.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  # Render API origin — must match NEXT_PUBLIC_API_ORIGIN on Vercel (web-client).
  VETO_API_BASE: https://veto-app-new.onrender.com

jobs:
  no-env-in-git:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: node .github/scripts/verify-no-secrets-in-git.js

  # Secret scanning across full git history, not just the current diff — catches a key
  # committed and later removed, which verify-no-secrets-in-git.js (working-tree only) misses.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check server.js
      - run: npm run lint
      - run: npm test
      # Blocking: verified 2026-07 that `npm audit --omit=dev` (i.e. excluding
      # build-only tooling like eslint) reports zero high/critical vulnerabilities
      # in backend's actual runtime dependency tree (axios/nodemailer/next-adjacent
      # CVEs from the same audit closed in the same change — see git history).
      # If a new high/critical runtime vuln lands, this SHOULD fail the build —
      # triage and fix it rather than re-adding continue-on-error.
      - name: npm audit (runtime deps, blocking)
        run: npm audit --omit=dev --audit-level=high

  web-client-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - run: npm ci
      # Still report-only, deliberately: unlike backend, web-client's runtime
      # tree is NOT clean yet — `npm audit --omit=dev` reports ~9 high-severity
      # findings, all transitive through `workbox-build` (pulled in at build
      # time by `@ducanh2912/next-pwa` to generate /sw.js — see DEPLOY.md's
      # PWA notes). No fix is available without a breaking next-pwa major
      # bump (10.2.9 → 10.2.6 per prior audit notes is actually a *downgrade*
      # of the pinned range — needs its own dedicated, tested upgrade task).
      # Flip to blocking once that upgrade lands and this is verified clean.
      - name: npm audit (runtime deps, report only)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_ORIGIN: ${{ env.VETO_API_BASE }}
          NEXT_PUBLIC_CALL_V2: '1'
      # Real E2E findings can be flaky against third-party services (Agora/Ably) in CI;
      # keep this non-blocking until the suite is proven stable, but always run + report.
      - name: Playwright E2E (report only)
        continue-on-error: true
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web-client/playwright-report/
          retention-days: 14

  # First-ever axe-core run against this app (2026-07) — real findings are
  # expected (color-contrast, missing labels, etc.) and get triaged before
  # this becomes a blocking gate, same rollout pattern as the npm audit gates.
  web-client-a11y:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_API_ORIGIN: http://localhost:5001
          NEXT_PUBLIC_CALL_V2: '1'
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Start backend (dev-mode auth bypasses enabled)
        working-directory: backend
        env:
          NODE_ENV: development
          PORT: '5001'
          MONGO_URI: mongodb://localhost:27017/veto_ci
          JWT_SECRET: ci-test-secret-not-for-production
          RETURN_OTP_IN_JSON: '1'
          ALLOW_DEV_LOGIN: '1'
          DEV_LOGIN_USERNAME: ***REDACTED***
          DEV_LOGIN_PASSWORD: '***REDACTED***'
        run: |
          nohup node server.js > backend.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://localhost:5001/health; do sleep 1; done'
      - name: Start web-client
        env:
          NEXT_PUBLIC_API_ORIGIN: http://localhost:5001
        run: |
          nohup npm run start -- -p 3000 > web-client.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://localhost:3000 >/dev/null; do sleep 1; done'
      - name: Axe accessibility scan (report only)
        continue-on-error: true
        env:
          E2E_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_BASE: http://localhost:5001
        run: npx playwright test --config=e2e/playwright.config.ts a11y.spec.ts --project=chromium-desktop --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axe-report
          path: web-client/playwright-report/
          retention-days: 14

  # Root Directory in Vercel project must stay `web-client`. Run `vercel deploy` from repo
  # root — if cwd is already `web-client`, Vercel appends the setting → web-client/web-client.
  deploy-vercel:
    runs-on: ubuntu-latest
    needs: [no-env-in-git, secret-scan, backend-ci]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: vercel-deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install and build Next.js
        working-directory: web-client
        env:
          NEXT_PUBLIC_API_ORIGIN: ${{ env.VETO_API_BASE }}
        run: |
          set -e
          npm ci
          npm run build

      - name: Verify PWA service worker was actually generated
        working-directory: web-client
        # Regression guard: next-pwa only hooks into webpack, not Turbopack (Next 16's
        # default for `next build`). If `build` script ever loses `--webpack`, this
        # silently stops producing /sw.js — which also kills SOS push notifications to
        # lawyers (worker/index.ts) with zero errors anywhere in the build log.
        run: |
          set -e
          test -f public/sw.js || { echo "::error::public/sw.js was not generated — PWA/push notifications will be broken in production. Check next.config.mjs / package.json build script uses 'next build --webpack'."; exit 1; }

      - name: Vercel CLI (auth check)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          npx --yes vercel@latest --version
          npx --yes vercel@latest whoami

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          npx --yes vercel@latest deploy --prod --yes
